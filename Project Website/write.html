<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Write Your Moment</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .writing-area {
      margin-top: 50px;
      text-align: center;
    }
    .writing-area textarea {
      width: 80%;
      height: 400px;
      padding: 20px;
      font-size: 1.2rem;
      border-radius: 10px;
      border: 2px solid #4CAF50;
      resize: none;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>
  <h1 style="color: white;">Write Your New Moment 🌸</h1>
  <div class="writing-area">
    <textarea placeholder="Start writing in English..."></textarea>
  </div>
</body>
</html>
