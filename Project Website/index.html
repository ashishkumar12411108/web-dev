<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Diary Flip Page</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="diary">
      <div class="book">
        <div class="page front">
          <button id="createMomentBtn">
            📖 Create a New Moment
          </button>
        </div>

        <div class="page back">
          <textarea placeholder="Start writing your moment here..."></textarea>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
